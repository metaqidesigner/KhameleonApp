packages:
  - artifacts/*
  - apps/*
  - khameleon-*
  - lib/*
  - lib/integrations/*
  - scripts

# This `allowBuilds` block is enforced by this environment's supply-chain
# policy wrapper around pnpm, not a native pnpm key - it auto-regenerates as
# a true/false prompt whenever a package's build script is ignored. Keep it
# present with explicit values; deleting it just makes it reappear as a
# placeholder (learned the hard way, 2026-10-03, khameleon-decisions-log.md).
# electron/extract-file-icon/node-window-manager/node-llama-cpp/tesseract.js
# are only needed by apps/khameleon-shell - real, local, native desktop
# control and (node-llama-cpp, tesseract.js) offline local document reading
# (Cross-App Control Phase 3) - and MUST be false in committed state so
# Docker's Linux build (a full workspace `pnpm install`, per /Dockerfile)
# never tries to compile/fetch these desktop-only binaries. Flip to `true`
# + `pnpm install` only while actually working on khameleon-shell locally,
# then flip back to `false` before committing.
allowBuilds:
  electron: false
  esbuild: true
  extract-file-icon: false
  node-llama-cpp: false
  node-window-manager: false
  tesseract.js: false

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.1
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: 4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

# Most non-darwin-arm64 platform binaries for esbuild/lightningcss/rollup/
# tailwindcss-oxide are pruned below to keep the lockfile lean for this
# project's own dev machine. linux-arm64-gnu is deliberately kept installable
# (not pruned) for all four - needed to build /Dockerfile's image, which runs
# on Linux (confirmed via a real build under colima, 2026-09-09). linux-x64-gnu
# was never pruned in the first place, so an x64 Linux self-host target
# already worked without this change.
overrides:
  '@esbuild-kit/esm-loader': npm:tsx@^4.21.0
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-arm64': '-'
  '@expo/ngrok-bin>@expo/ngrok-bin-darwin-x64': '-'
