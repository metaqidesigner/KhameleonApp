<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Khameleon — dev control panel</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    padding: 16px;
  }
  h1 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #58a6ff; margin: 0 0 10px; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #c9d1d9; font-size: 13px; }
  #log { margin-top: 10px; font-size: 12px; color: #8b949e; min-height: 40px; white-space: pre-wrap; }
  .hint { font-size: 11px; color: #6e7681; margin-top: 6px; }
</style>
</head>
<body>
  <h1>Khameleon — dev command input</h1>
  <input id="cmd" placeholder='Try: "bring up a youtube video" then "move it aside"' autofocus />
  <div class="hint">Enter to run. This box stands in for voice/agent input during development.</div>
  <div id="log"></div>

  <script>
    const input = document.getElementById("cmd");
    const log = document.getElementById("log");

    input.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter" || !input.value.trim()) return;
      const text = input.value;
      input.value = "";
      const result = await window.khameleon.runCommand(text);
      log.textContent = `> ${text}\n${result}\n\n` + log.textContent;
    });
  </script>
</body>
</html>
