kind = "web"
previewPath = "/"
title = "Khameleon Command"
version = "1.0.0"
id = "artifacts/khameleon-command"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20596

[services.development]
run = "pnpm --filter @workspace/khameleon-command run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/khameleon-command", "run", "build" ]
publicDir = "artifacts/khameleon-command/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20596"
BASE_PATH = "/"
