name: khameleon-shell (Windows)

# Real Windows verification for apps/khameleon-shell (Cross-App Control -
# khameleon-decisions-log.md, 2026-10-03). Newton doesn't have a Windows
# machine; this gives the project a genuine Windows machine in the cloud to
# build and run the Windows-specific native window-control code on, rather
# than deferring Windows to "flagged, untested" the way Phase 0 initially
# had to. Public repo, so these runner-minutes are free.
on:
  workflow_dispatch:
  push:
    branches: ["design/home-implemented-glass", "main"]
    paths:
      - "apps/khameleon-shell/**"
      - "khameleon-window-agent/**"
      - "khameleon-file-agent/**"
      - "khameleon-memory/**"
      - "lib/integrations/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/khameleon-shell-windows.yml"

jobs:
  build-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      # electron/node-window-manager/extract-file-icon are deliberately kept
      # OUT of the committed onlyBuiltDependencies (pnpm-workspace.yaml) so
      # the Docker/Linux build never tries to compile these macOS/Windows-
      # only native bindings. This runner needs them, so patch a local,
      # never-committed copy before installing - same reasoning as the
      # local-dev `allowBuilds` flip, just scoped to this ephemeral checkout.
      - name: Allow native builds for this Windows run
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = 'pnpm-workspace.yaml';
            let y = fs.readFileSync(path, 'utf8');
            y = y.replace(
              /onlyBuiltDependencies:\r?\n/,
              \"onlyBuiltDependencies:\n  - electron\n  - extract-file-icon\n  - node-window-manager\n\"
            );
            fs.writeFileSync(path, y);
          "

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build khameleon-shell
        run: pnpm --filter @khameleon/shell build

      - name: Typecheck khameleon-shell and khameleon-window-agent
        run: |
          pnpm --filter @khameleon/shell typecheck
          pnpm --filter khameleon-window-agent exec tsc --noEmit

      - name: Run khameleon-window-agent's test suite
        run: pnpm --filter khameleon-window-agent test

      # Proves node-window-manager's REAL Windows native addon (windows.cc,
      # built via node-gyp above) actually works against the real Windows
      # OS on this runner - not just "it compiled". Opens Notepad, confirms
      # the addon can enumerate it as a real external window and read its
      # bounds, then closes it. This is exactly the capability Phase 1/2
      # build on top of.
      - name: Smoke-test real window enumeration on Windows
        shell: pwsh
        run: |
          $notepad = Start-Process notepad -PassThru
          Start-Sleep -Seconds 2
          node -e "
            const { windowManager } = require('node-window-manager');
            const windows = windowManager.getWindows();
            const notepad = windows.find(w => (w.path || '').toLowerCase().includes('notepad'));
            if (!notepad) {
              console.error('FAIL: notepad.exe was not found among', windows.length, 'enumerated windows');
              process.exit(1);
            }
            const bounds = notepad.getBounds();
            console.log('OK: found notepad window, bounds =', JSON.stringify(bounds));
            if (typeof bounds.width !== 'number' || bounds.width <= 0) {
              console.error('FAIL: bounds did not look real');
              process.exit(1);
            }
          "
          Stop-Process -Id $notepad.Id -Force

      - name: Package (unsigned - no Authenticode cert yet)
        run: pnpm --filter @khameleon/shell exec electron-builder --win --dir

      # Proves the actual packaged .exe launches for real on real Windows,
      # same bar as the macOS verification (process alive, no crash) - not
      # claiming full UI verification, which still wants Newton's wife's
      # real Windows machine per their own plan.
      - name: Launch the packaged app and confirm it stays alive
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "apps/khameleon-shell/release" -Recurse -Filter "Khameleon.exe" | Select-Object -First 1
          if (-not $exe) { throw "Khameleon.exe not found in release output" }
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 6
          $alive = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $alive) { throw "Khameleon.exe exited/crashed within 6 seconds of launch" }
          Write-Host "OK: Khameleon.exe is running, PID $($proc.Id)"
          Stop-Process -Id $proc.Id -Force

      - name: Upload unpacked Windows build for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: khameleon-windows-unpacked
          path: apps/khameleon-shell/release/win-unpacked
          retention-days: 14
